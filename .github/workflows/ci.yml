name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: 安裝套件與開發工具
        run: pip install -e .[dev]

      # pyproject 已設 testpaths = ["tests"]，裸跑即可。
      - name: 執行測試（用合成 fixture，不需要賽事資料）
        run: python -m pytest -q

      # 只有在 repo 裡確實有合併後的賽事資料時才跑。
      - name: 訓練冒煙測試（極小網格，約 15 秒）
        if: ${{ hashFiles('data/merged/2022-2024_Azerbaijan_Grand_Prix.xlsx') != '' }}
        run: python scripts/train.py --experiment wind --model dt --quick --no-plots
