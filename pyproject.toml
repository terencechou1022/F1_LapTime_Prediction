[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1lab"
version = "1.0.0"
description = "分析風與氣溫如何影響 F1 單圈表現的物件導向工具組（2022–2025 地面效應世代）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastf1>=3.0",
    "pandas>=2.0",
    "numpy>=2.0",
    "scikit-learn>=1.0",
    "xgboost>=3.0",
    "joblib>=1.0",
    "matplotlib>=3.0",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["f1lab"]

[tool.pytest.ini_options]
# 限定只收集 tests/：專案根目錄在本機可能留有未納管的舊腳本，
# 不設這行的話裸跑 pytest 會連它們一起收集，在收集階段就失敗。
testpaths = ["tests"]
