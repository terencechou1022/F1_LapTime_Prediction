[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1lab"
version = "1.0.0"
description = "OOP toolkit for analyzing weather effects on F1 lap performance (2022-2025 ground-effect era)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastf1>=3.0",
    "pandas>=2.0",
    "numpy>=2.0",
    "scikit-learn>=1.0",
    "xgboost>=3.0",
    "joblib>=1.0",
    "matplotlib>=3.0",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "ipykernel>=6"]
demo = ["streamlit>=1.30"]

[tool.setuptools]
packages = ["f1lab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# tests and the notebook insert the project root into sys.path before importing f1lab
"tests/*" = ["E402"]
"notebooks/*.ipynb" = ["E402"]
